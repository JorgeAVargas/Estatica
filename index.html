<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Departamental: Estática</title>
    <!-- Tailwind CSS para el diseño -->

    <style>

        .option-btn:disabled { cursor: not-allowed; }

</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold">📚 Quiz Departamental: Estática</h1>
            <span class="text-sm bg-blue-800 py-1 px-3 rounded-full hidden md:inline-block">Bedford & Fowler (Caps. 3-6)</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center p-4 md:p-8 w-full max-w-4xl mx-auto">
        
        <!-- Controles de Filtro -->
        <div class="w-full bg-white p-4 rounded-lg shadow-sm mb-6 flex flex-wrap gap-2 justify-center border border-slate-200">
            <span class="font-semibold text-slate-600 mr-2 self-center">Filtro:</span>
            <button onclick="filterData('Todos')" class="filter-btn active bg-blue-600 text-white px-4 py-2 rounded transition" data-filter="Todos">Todos</button>
            <button onclick="filterData(3)" class="filter-btn bg-slate-200 text-slate-700 hover:bg-slate-300 px-4 py-2 rounded transition" data-filter="3">Capítulo 3</button>
            <button onclick="filterData(4)" class="filter-btn bg-slate-200 text-slate-700 hover:bg-slate-300 px-4 py-2 rounded transition" data-filter="4">Capítulo 4</button>
            <button onclick="filterData(5)" class="filter-btn bg-slate-200 text-slate-700 hover:bg-slate-300 px-4 py-2 rounded transition" data-filter="5">Capítulo 5</button>
            <button onclick="filterData(6)" class="filter-btn bg-slate-200 text-slate-700 hover:bg-slate-300 px-4 py-2 rounded transition" data-filter="6">Capítulo 6</button>
        </div>

        <!-- Tarjeta de Pregunta -->
        <div class="w-full bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden flex flex-col">
            
            <div class="bg-blue-50 border-b border-blue-100 p-4 flex justify-between items-center">
                <span id="cap-label" class="font-bold text-blue-800 uppercase tracking-wide text-sm">Capítulo X - Teoría</span>
                <span id="counter-label" class="text-sm font-semibold text-blue-600 bg-white px-3 py-1 rounded-full border border-blue-200 shadow-sm">1 / 80</span>
            </div>

            <div class="p-6 md:p-8 flex-grow">
                <p id="question-text" class="text-xl md:text-2xl text-slate-700 mb-8 font-medium leading-relaxed">
                    Cargando pregunta...
                </p>

                <!-- Contenedor de Opciones Múltiples -->
                <div id="options-container" class="flex flex-col gap-3 mb-6">
                    <!-- Los botones se generan dinámicamente aquí -->
                </div>

                <!-- Controles de Ayuda -->
                <div class="flex flex-wrap gap-4 mb-4">
                    <button onclick="toggleHint()" class="flex-1 bg-amber-100 hover:bg-amber-200 text-amber-800 font-semibold py-2 px-4 rounded-lg transition flex items-center justify-center gap-2 border border-amber-300">

                    </button>
                </div>

                <div id="hint-container" class="hidden fade-in bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r mb-4">

                    <p id="hint-text" class="text-amber-900">...</p>
                </div>

                <!-- Feedback Visual (Oculto por defecto) -->
                <div id="feedback-container" class="hidden fade-in p-4 rounded-r mb-4 text-lg font-bold">

                </div>
            </div>

            <!-- Navegación -->
            <div class="bg-slate-50 p-4 flex justify-between items-center border-t border-slate-200">
                <button onclick="prevCard()" class="text-slate-500 hover:text-slate-800 font-semibold transition px-4 py-2">⬅ Anterior</button>
                <button onclick="nextCard()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold transition shadow-md shadow-blue-200 text-lg">Siguiente ➡</button>
            </div>
        </div>
    </main>

    <!-- Script de Datos y Lógica -->
    <script>
        // Banco de Preguntas Completo (80 preguntas convertidas a Opción Múltiple)
        const quizDatabase = [
            // ================= CAPITULO 3: FUERZAS Y EQUILIBRIO =================
            { cap: 3, type: "Teoría", q: "¿Cuál es la condición matemática vectorial necesaria y suficiente para que una partícula se encuentre en equilibrio estático?", h: "Aplica la Primera Ley de Newton para un cuerpo que no altera su estado de reposo.", opts: [
                { t: "La suma vectorial de todas las fuerzas concurrentes debe ser igual a cero (\\(\\sum \\mathbf{F} = 0\\)).", c: true },
                { t: "La suma de los momentos debe ser igual a cero (\\(\\sum \\mathbf{M} = 0\\)).", c: false },
                { t: "Todas las fuerzas aplicadas deben ser paralelas entre sí.", c: false },
                { t: "La partícula debe estar moviéndose a una aceleración constante.", c: false }
            ]},
            { cap: 3, type: "Teoría", q: "En el análisis de una partícula en el espacio tridimensional (3D), ¿cuántas ecuaciones escalares independientes de equilibrio se pueden formular?", h: "Corresponde al número de ejes en el plano cartesiano espacial.", opts: [
                { t: "Seis ecuaciones independientes.", c: false },
                { t: "Tres ecuaciones independientes (\\(\\sum F_x = 0, \\sum F_y = 0, \\sum F_z = 0\\)).", c: true },
                { t: "Dos ecuaciones independientes.", c: false },
                { t: "Una ecuación vectorial única.", c: false }
            ]},
            { cap: 3, type: "Teoría", q: "¿Cómo se relaciona la fuerza de un resorte lineal elástico con su deformación?", h: "Piensa en qué variables definen la rigidez y el estiramiento de un resorte.", opts: [
                { t: "Es inversamente proporcional a su longitud original.", c: false },
                { t: "Mediante la ley de Hooke (\\(F = k \\cdot s\\)), proporcional a la constante y al cambio en longitud.", c: true },
                { t: "La fuerza es igual a la constante del resorte al cuadrado.", c: false },
                { t: "Es independiente de la deformación mientras no se rompa el límite elástico.", c: false }
            ]},
            { cap: 3, type: "Teoría", q: "Al trazar el diagrama de cuerpo libre de una polea ideal (sin fricción ni masa), ¿qué propiedad tiene la fuerza del cable que pasa por ella?", h: "Una polea ideal solo redirige la fuerza, no la absorbe ni la incrementa.", opts: [
                { t: "La tensión se duplica después de pasar por la polea.", c: false },
                { t: "La tensión se reduce a la mitad para generar ventaja mecánica.", c: false },
                { t: "La magnitud de la tensión se mantiene constante a lo largo de todo el cable continuo.", c: true },
                { t: "La tensión depende del radio de la polea.", c: false }
            ]},
            { cap: 3, type: "Teoría", q: "Si una partícula está en equilibrio bajo la acción de exactamente dos fuerzas, ¿qué condiciones deben cumplir estas fuerzas?", h: "Imagina un juego de tirar de la cuerda donde el pañuelo central no se mueve.", opts: [
                { t: "Deben ser perpendiculares y de igual magnitud.", c: false },
                { t: "Deben tener la misma magnitud, misma línea de acción (colineales) y sentidos opuestos.", c: true },

            { cap: 3, type: "Teoría", q: "¿Qué representan los cosenos directores de un vector de fuerza tridimensional?", h: "Son los componentes del vector unitario que define la dirección de la fuerza.", opts: [
                { t: "Son los cosenos de los ángulos que forma el vector con cada eje coordenado positivo; sus cuadrados suman 1.", c: true },
                { t: "Son las proyecciones de la fuerza en el plano XY exclusivamente.", c: false },
                { t: "Son magnitudes escalares que indican el peso del objeto.", c: false },
                { t: "Es el producto cruz entre el vector fuerza y la gravedad.", c: false }

            { cap: 3, type: "Teoría", q: "Si se conoce la magnitud de una fuerza y las coordenadas espaciales de dos puntos sobre su línea de acción, ¿cómo se determina su vector cartesiano?", h: "Convierte primero la geometría de posición en un vector direccional puro.", opts: [
                { t: "Sumando las coordenadas de ambos puntos y multiplicando por la magnitud.", c: false },
                { t: "Calculando el producto cruz de ambos puntos espaciales.", c: false },
                { t: "Multiplicando la magnitud de la fuerza por el vector unitario dirigido del punto inicial al final.", c: true },
                { t: "Dividiendo la magnitud entre la distancia total entre los puntos.", c: false }

            { cap: 3, type: "Teoría", q: "¿Qué tipo de fuerza interna es la única que puede soportar un cable o cuerda flexible?", h: "Físicamente no es posible 'empujar' con un objeto flexible sin que se doble.", opts: [
                { t: "Fuerzas de compresión.", c: false },
                { t: "Momentos flectores.", c: false },

                { t: "Solo fuerzas de tensión (tracción dirigida alejándose de la partícula).", c: true }

            { cap: 3, type: "Teoría", q: "En el método analítico de suma de fuerzas concurrentes, ¿qué representan los componentes cartesianos \\(F_x\\) y \\(F_y\\)?", h: "Imagina que iluminas el vector desde arriba y desde un lado.", opts: [
                { t: "Las derivadas de la fuerza respecto al tiempo.", c: false },
                { t: "Las proyecciones ortogonales (perpendiculares) del vector de fuerza sobre los ejes X e Y.", c: true },
                { t: "El momento generado por la fuerza en esos ejes.", c: false },
                { t: "Los vectores de posición de la partícula.", c: false }
            ]},
            { cap: 3, type: "Teoría", q: "Si tres fuerzas concurrentes coplanares mantienen a una partícula en equilibrio, geométricamente ¿qué figura forman al sumar los vectores de cabeza a cola?", h: "Si la resultante es cero, el camino vectorial debe regresar al punto de origen.", opts: [
                { t: "Una parábola.", c: false },
                { t: "Una línea recta infinita.", c: false },
                { t: "Un triángulo cerrado.", c: true },
                { t: "Un círculo perfecto.", c: false }
            ]},
            { cap: 3, type: "Teoría", q: "¿Por qué el peso de un objeto siempre se representa como un vector apuntando rígidamente hacia abajo en un DCL, sin importar la inclinación del apoyo?", h: "El campo gravitacional no depende de la geometría de la rampa.", opts: [
                { t: "Porque la gravedad actúa siempre hacia el centro de la Tierra (dirección vertical descendente).", c: true },
                { t: "Porque las superficies inclinadas no afectan la fricción.", c: false },
                { t: "Porque el peso siempre es ortogonal a la superficie de contacto.", c: false },
                { t: "Es una convención visual arbitraria sin base física.", c: false }

            { cap: 3, type: "Teoría", q: "¿Qué establece el principio fundamental de transmisibilidad en mecánica estática?", h: "Empujar un objeto rígido desde atrás tiene el mismo efecto que tirar de él desde adelante.", opts: [
                { t: "Las fuerzas se pueden transmitir a través del vacío sin pérdida de energía.", c: false },
                { t: "Deslizar una fuerza sobre su propia línea de acción no altera el efecto externo sobre el cuerpo rígido.", c: true },
                { t: "Una partícula transmite su masa a las partículas adyacentes.", c: false },
                { t: "La tensión en un cable se transmite transversalmente.", c: false }
            ]},
            { cap: 3, type: "Teoría", q: "En componentes rectangulares 3D, si una fuerza forma un ángulo de \\(60^\\circ\\) con el eje X y \\(60^\\circ\\) con el eje Y, ¿qué ángulo forma con el eje Z positivo?", h: "Usa la identidad pitagórica de los cosenos directores: la suma de sus cuadrados es 1.", opts: [
                { t: "\\(90^\\circ\\)", c: false },
                { t: "\\(60^\\circ\\)", c: false },
                { t: "\\(45^\\circ\\) o \\(135^\\circ\\)", c: true },
                { t: "\\(30^\\circ\\)", c: false }

            { cap: 3, type: "Teoría", q: "Cuando una partícula se apoya sobre una superficie plana perfectamente lisa, ¿en qué dirección actúa la fuerza de reacción de la superficie?", h: "La palabra 'lisa' significa que no hay fricción tangencial.", opts: [
                { t: "Paralela a la superficie de contacto.", c: false },
                { t: "En dirección opuesta al movimiento de la partícula.", c: false },
                { t: "Perfectamente perpendicular (normal) a la superficie de contacto.", c: true },
                { t: "A 45 grados respecto al plano horizontal.", c: false }
            ]},
            { cap: 3, type: "Teoría", q: "Si el producto punto entre dos fuerzas concurrentes es cero, ¿cuál es su relación angular?", h: "Recuerda para qué ángulo el coseno vale cero.", opts: [
                { t: "Son ortogonales (perpendiculares entre sí a \\(90^\\circ\\)).", c: true },
                { t: "Son paralelas (\\(0^\\circ\\)).", c: false },
                { t: "Son antiparalelas (\\(180^\\circ\\)).", c: false },
                { t: "Forman un ángulo agudo.", c: false }
            ]},
            { cap: 3, type: "Práctica", q: "Un semáforo de 20 kg cuelga del centro de un cable flexible que se pandea. Si las dos mitades del cable forman ángulos de \\(15^\\circ\\) con la horizontal, ¿cuál es la tensión en el cable?", h: "\\(\\sum F_y = 0 \\rightarrow 2T \\sin(15^\\circ) = 20(9.81)\\)", opts: [
                { t: "\\(\\approx 196\\text{ N}\\)", c: false },

                { t: "\\(\\approx 758\\text{ N}\\)", c: false },
                { t: "\\(\\approx 100\\text{ N}\\)", c: false }

            { cap: 3, type: "Práctica", q: "Una fuerza de 500 N se aplica a una partícula en el origen y está dirigida al punto (3, 4, 0) m. Determine su componente en el eje Y.", h: "El vector unitario es \\(0.6\\mathbf{i} + 0.8\\mathbf{j}\\). Multiplica la magnitud por la componente Y.", opts: [
                { t: "300 N", c: false },
                { t: "500 N", c: false },

                { t: "400 N", c: true }
            ]},
            { cap: 3, type: "Práctica", q: "Una partícula descansa sobre un plano inclinado a \\(30^\\circ\\) respecto a la horizontal. Si la componente del peso paralela al plano es de 100 N, ¿cuál es el peso total del objeto?", h: "\\(W \\sin(30^\\circ) = 100\\)", opts: [
                { t: "50 N", c: false },
                { t: "200 N", c: true },
                { t: "115 N", c: false },
                { t: "100 N", c: false }
            ]},
            { cap: 3, type: "Práctica", q: "Un resorte con longitud natural de 1.2 m y rigidez \\(k = 500\\text{ N/m}\\) se estira hasta 1.5 m. ¿Qué fuerza ejerce el resorte?", h: "\\(F = k \\cdot (L_f - L_0)\\)", opts: [
                { t: "150 N", c: true },
                { t: "600 N", c: false },
                { t: "750 N", c: false },
                { t: "300 N", c: false }
            ]},
            { cap: 3, type: "Práctica", q: "Tres fuerzas actúan sobre una partícula: \\(\\mathbf{F}_1 = 20\\mathbf{i}\\text{ N}\\), \\(\\mathbf{F}_2 = 10\\mathbf{j}\\text{ N}\\) y \\(\\mathbf{F}_3\\). Si la partícula está en equilibrio, determine \\(\\mathbf{F}_3\\).", h: "La sumatoria total de los tres vectores debe ser igual a cero.", opts: [
                { t: "\\(\\mathbf{F}_3 = 20\\mathbf{i} + 10\\mathbf{j}\\text{ N}\\)", c: false },
                { t: "\\(\\mathbf{F}_3 = -20\\mathbf{i} + 10\\mathbf{j}\\text{ N}\\)", c: false },
                { t: "\\(\\mathbf{F}_3 = -20\\mathbf{i} - 10\\mathbf{j}\\text{ N}\\)", c: true },
                { t: "\\(\\mathbf{F}_3 = 10\\mathbf{i} + 20\\mathbf{j}\\text{ N}\\)", c: false }

            // ================= CAPITULO 4: MOMENTOS Y SISTEMAS =================
            { cap: 4, type: "Teoría", q: "Defina el concepto vectorial de 'momento de una fuerza' con respecto a un punto.", h: "Involucra un producto vectorial entre el vector posición y el vector fuerza.", opts: [
                { t: "Es la tendencia de la fuerza a causar traslación lineal.", c: false },
                { t: "Es la tendencia de la fuerza a causar rotación, definido como \\(\\mathbf{M}_O = \\mathbf{r} \\times \\mathbf{F}\\).", c: true },
                { t: "Es el producto punto entre la masa y la aceleración.", c: false },
                { t: "Es el trabajo realizado por la fuerza a lo largo de una distancia.", c: false }

            { cap: 4, type: "Teoría", q: "En el producto cruz \\(\\mathbf{M}_O = \\mathbf{r} \\times \\mathbf{F}\\), ¿qué representa el vector de posición \\(\\mathbf{r}\\)?", h: "Es el brazo de palanca vectorial que 'conecta' el pivote con la fuerza.", opts: [

                { t: "Un vector unitario perpendicular al plano de rotación.", c: false },
                { t: "Un vector trazado desde el punto de referencia hasta CUALQUIER punto sobre la línea de acción de la fuerza.", c: true },
                { t: "La distancia escalar más corta (perpendicular) a la fuerza.", c: false }
            ]},
            { cap: 4, type: "Teoría", q: "¿Qué regla determina convencionalmente el sentido y dirección del vector momento resultante en un espacio tridimensional?", h: "Involucra el uso de tu mano para alinear vectores cartesianos.", opts: [

                { t: "El teorema de los ejes paralelos.", c: false },
                { t: "La regla de la mano izquierda de Fleming.", c: false },
                { t: "La ley del paralelogramo.", c: false }

            { cap: 4, type: "Teoría", q: "¿Qué establece el Teorema de Varignon (Principio de Momentos)?", h: "Habla sobre descomponer una fuerza para facilitar el cálculo de momentos.", opts: [
                { t: "El momento de una fuerza es siempre nulo si pasa por el centro de masa.", c: false },

            { cap: 4, type: "Teoría", q: "¿Cómo se calcula la magnitud escalar del momento de una fuerza coplanar?", h: "Piensa en la fórmula más intuitiva del uso de una palanca.", opts: [

                { t: "Multiplicando la masa por la aceleración de la gravedad.", c: false },
                { t: "Dividiendo la fuerza entre la distancia al pivote.", c: false },
                { t: "Multiplicando la magnitud de la fuerza por la distancia perpendicular desde el eje a la línea de acción (\\(M = F \\cdot d\\)).", c: true }

                { t: "La doble integral de área.", c: false },
                { t: "El producto punto entre la fuerza y el vector posición.", c: false },
                { t: "La derivada cruzada del momento principal.", c: false }

            { cap: 4, type: "Teoría", q: "¿Cuáles son las tres características que definen estrictamente a un 'par de fuerzas'?", h: "Imagina cómo tomas el volante de tu auto para girarlo en tu propio eje.", opts: [

            { cap: 6, type: "Teoría", q: "Si una polea está unida al eslabón de un marco y el cable la rodea, ¿cómo conviene aislarla en el DCL?", h: "Separar la rueda de la barra genera más incógnitas en el pasador interno.", opts: [
                { t: "Manteniendo la polea unida al DCL y exponiendo las tensiones del cable cortado a los lados.", c: true },
                { t: "Ignorar la polea si el cable no se mueve.", c: false },
                { t: "Calcular primero la aceleración angular de la polea.", c: false },
                { t: "Remover la polea y aplicar una carga concentrada doble en el pasador.", c: false }
            ]},
            { cap: 6, type: "Práctica", q: "Un nudo en forma de 'T' no tiene carga externa. La barra transversal (el techo de la T) es un solo tubo continuo. ¿Cuál es la fuerza en la barra perpendicular?", h: "La barra inferior vertical llega, choca en 90 grados, pero no tiene nadie que la contrarreste verticalmente.", opts: [
                { t: "Es un promedio de las tensiones horizontales.", c: false },
                { t: "Fuerza Cero.", c: true },
                { t: "Tensión máxima, a punto de fluencia.", c: false },
                { t: "Compresión infinita.", c: false }
            ]},
            { cap: 6, type: "Práctica", q: "En un nudo concurren carga vertical abajo 100N, barra A vertical y barra B horizontal. Calcule la fuerza en A y B.", h: "Separa X y Y mentalmente. B está sola en horizontal. A lucha sola contra la carga en vertical.", opts: [
                { t: "A = 50 N, B = 50 N", c: false },
                { t: "A = 0 N, B = 100 N", c: false },
                { t: "A = 100 N (Tensión asumiendo nudo jalando arriba), B = Fuerza Cero.", c: true },
                { t: "A = 100 N (Compresión asumiendo nudo bajando), B = 100 N", c: false }
            ]},
            { cap: 6, type: "Práctica", q: "Método Secciones: Se aísla mitad izquierda. Se cortan: cordón superior horizontal, cordón inferior horizontal y una diagonal. Para calcular el cordón INFERIOR, ¿dónde pivotas momentos?", h: "El cordón superior y la diagonal cortada se intersectarán en algún nudo de la parte superior derecha (fuera o dentro del diagrama cortado).", opts: [
                { t: "En el apoyo del suelo.", c: false },
                { t: "En el nudo superior donde se cruzan la línea del cordón superior y la diagonal cortada.", c: true },
                { t: "En el centroide exacto del fragmento.", c: false },
                { t: "En cualquier punto sobre el cordón inferior mismo.", c: false }
            ]},
            { cap: 6, type: "Práctica", q: "Polea de radio 0.5 m atornillada al final de un brazo de marco. Cable rodea polea con tensión de 200 N (ambos lados apuntan hacia abajo). Al dejar polea pegada al DCL del brazo, ¿qué efecto genera?", h: "Ambas fuerzas de 200N jalan el borde del disco.", opts: [
                { t: "Una fuerza concentrada de 400N justo en el tornillo, sin momentos extra.", c: false },
                { t: "Dos fuerzas de 200 N empujando hacia arriba en el pasador.", c: false },
                { t: "Una fuerza de 200N en el tornillo central.", c: false },
                { t: "Dos fuerzas abajo de 200 N, cada una ubicada a 0.5 m del pasador de la polea.", c: true }
            ]},
            { cap: 6, type: "Práctica", q: "Armadura triangular equilátera simple (3 nudos, 3 barras). Carga vertical F en el nudo superior cenital. ¿Cuál es la reacción vertical en los apoyos de la base?", h: "Un triángulo equilátero con carga central distribuye geométricamente perfecto la compresión a los lados.", opts: [
                { t: "F/3 en cada apoyo.", c: false },
                { t: "F en el apoyo derecho, 0 en el izquierdo.", c: false },
                { t: "F/2 en cada apoyo vertical.", c: true },
                { t: "F multiplicado por el coseno de 60 grados.", c: false }
            ]}
        ];

        // Estado
        let currentIndex = 0;
        let filteredData = quizDatabase;
        let currentOptions = [];
        let hasAnsweredCurrent = false;

        // Referencias al DOM
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hText = document.getElementById('hint-text');
        const capLabel = document.getElementById('cap-label');
        const counterLabel = document.getElementById('counter-label');
        const hintContainer = document.getElementById('hint-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Utilidad para mezclar array (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Inicializar
        function init() {
            renderCard();
        }

        // Filtrado por Capítulo
        function filterData(cap) {
            filterBtns.forEach(btn => {
                if(btn.dataset.filter == cap) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-slate-200', 'text-slate-700');
                } else {
                    btn.classList.add('bg-slate-200', 'text-slate-700');
                    btn.classList.remove('bg-blue-600', 'text-white');
                }
            });

            if (cap === 'Todos') {
                filteredData = quizDatabase;
            } else {
                filteredData = quizDatabase.filter(item => item.cap === parseInt(cap));
            }
            currentIndex = 0;
            renderCard();
        }

        // Renderizar la tarjeta activa
        function renderCard() {
            if(filteredData.length === 0) return;

            hasAnsweredCurrent = false;
            feedbackContainer.classList.add('hidden');
            hintContainer.classList.add('hidden');

            const item = filteredData[currentIndex];
            capLabel.innerText = `Capítulo ${item.cap} - ${item.type}`;
            counterLabel.innerText = `Pregunta ${currentIndex + 1} de ${filteredData.length}`;
            
            qText.innerHTML = item.q;
            hText.innerHTML = item.h;

            // Clonar opciones y mezclarlas aleatoriamente
            currentOptions = [...item.opts];
            shuffleArray(currentOptions);

            // Generar botones de opciones
            optionsContainer.innerHTML = '';
            currentOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:bg-blue-50 hover:border-blue-300 text-lg shadow-sm text-slate-700`;
                btn.innerHTML = `<span class="font-bold mr-3 text-slate-400 block sm:inline-block mb-1 sm:mb-0">${String.fromCharCode(65 + index)}.</span> ${opt.t}`;
                btn.onclick = () => handleSelection(btn, opt.c, index);
                optionsContainer.appendChild(btn);
            });

            // Procesar LaTeX de la nueva pregunta generada
            if (window.MathJax) {
                MathJax.typesetPromise().catch(function (err) {
                    console.log('MathJax error: ' + err.message);
                });
            }
        }

        // Evaluar selección
        function handleSelection(clickedBtn, isCorrect, selectedIndex) {
            if (hasAnsweredCurrent) return; // Evitar múltiples selecciones
            hasAnsweredCurrent = true;

            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            
            // Deshabilitar todos los botones
            allBtns.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
                
                // Mostrar correcta siempre
                if (currentOptions[idx].c) {
                    btn.classList.replace('border-slate-200', 'border-emerald-500');
                    btn.classList.add('bg-emerald-50', 'text-emerald-900');
                    btn.innerHTML += ` <span class="float-right text-emerald-600 font-bold">✅ Correcta</span>`;
                }
            });

            // Reacción visual al botón clicado (si fue incorrecto)
            if (!isCorrect) {
                clickedBtn.classList.replace('border-slate-200', 'border-red-400');
                clickedBtn.classList.add('bg-red-50', 'text-red-900');
                clickedBtn.innerHTML += ` <span class="float-right text-red-600 font-bold">❌ Incorrecta</span>`;
                
                // Feedback
                feedbackContainer.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800');
                feedbackContainer.classList.add('bg-red-100', 'text-red-800');
                feedbackContainer.innerHTML = 'Repasa la teoría. Lee la pista para comprender la lógica detrás de la opción correcta.';
            } else {
                feedbackContainer.classList.remove('hidden', 'bg-red-100', 'text-red-800');
                feedbackContainer.classList.add('bg-emerald-100', 'text-emerald-800');
                feedbackContainer.innerHTML = '¡Excelente razonamiento estático!';
            }
        }

        // Mostrar u ocultar pista
        function toggleHint() {
            hintContainer.classList.toggle('hidden');
        }

        // Controles de navegación
        function nextCard() {
            if (currentIndex < filteredData.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                alert("¡Felicidades! Has revisado todas las preguntas de esta selección.");
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        // Iniciar al cargar
        window.onload = init;
    </script>
</body>
</html>
